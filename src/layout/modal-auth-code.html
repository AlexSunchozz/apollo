<!--
  Окно «Введите код» (Bootstrap Modal #<id>-modal, вид ui/modal --form --code) — подключается из layout/modal-auth.html
  Figma:  по телефону 1:6299, по почте 1:6283, неверный код 1:6341; мобилка 1:6454, 1:6440, 1:6486
  Параметры: id; sent — «на» / «на почту»; target — куда отправили (JS подставляет введённый телефон / почту);
  note — подсказка под текстом («Никому не сообщайте…»), after — под кнопкой («Если письма нет…»), обе необязательны ("");
  linkText + login ("email" / "phone") — ссылка внизу: вход с паролем #auth-login-modal нужного вида.
  Код отправляется сам, когда введены все цифры (data-code-length); «Отправить новый код» — событие ap:auth-resend.
  Неверный код — состояние окна: элементы [data-auth-state="error"] видны вместо [data-auth-state="default"]
  (layout/auth.js), «Попробовать снова» возвращает обычное состояние.
-->
<div class="modal fade ap-modal ap-modal--form ap-modal--code" id="@@id-modal" tabindex="-1" aria-labelledby="@@id-modal-title" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <form class="d-flex flex-column align-items-center gap-3 text-center" action="#" method="post" novalidate data-form data-auth-check data-auth-code>
        <div class="d-flex flex-column align-items-center align-self-stretch gap-2">
          <button class="ap-modal__close align-self-end" type="button" data-bs-dismiss="modal" aria-label="Закрыть"><svg class="ap-icon" aria-hidden="true"><use href="@@root/img/sprite.svg#close"></use></svg></button>
          <h2 class="ap-modal__title" id="@@id-modal-title"><span data-auth-state="default">Введите код</span><span data-auth-state="error" hidden>Неверный код</span></h2>
          <p class="ap-modal__text" data-auth-state="default">Отправили код подтверждения @@sent&nbsp;<span data-auth-target>@@target</span></p>
          <p class="ap-modal__text" data-auth-state="error" hidden>Попробуйте ещё&nbsp;раз</p>
          @@if (context.note) {<p class="ap-modal__lead" data-auth-state="default">@@note</p>}
        </div>

        <div class="d-flex flex-column align-self-stretch gap-2 gap-sm-3 text-start">
          <div class="ap-field ap-field--legend">
            <input class="ap-input" type="text" id="@@id-input" name="code" autocomplete="one-time-code" inputmode="numeric" maxlength="4" aria-label="Код подтверждения" required data-code-length="4">
            <button class="ap-field__action" type="button" aria-label="Очистить поле" data-field-clear><svg class="ap-icon" aria-hidden="true"><use href="@@root/img/sprite.svg#clear"></use></svg></button>
          </div>
          <p class="ap-modal__error" role="alert" data-auth-state="error" hidden>Код не&nbsp;подошел</p>
          <button class="ap-btn ap-btn--primary" type="button" data-auth-state="default" data-auth-resend>Отправить новый код&nbsp;→</button>
          <button class="ap-btn ap-btn--primary" type="button" data-auth-state="error" data-auth-retry hidden>Попробовать снова&nbsp;→</button>
        </div>

        @@if (context.after) {<p class="ap-modal__lead">@@after</p>}
        <a class="ap-link" href="#auth-login-modal" data-bs-toggle="modal" data-auth-login="@@login">@@linkText</a>
      </form>
    </div>
  </div>
</div>
