<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>@@title</title>
  <meta name="description" content="@@description">

  <!-- Фавиконки. Figma: 1:34202
       favicon.ico и site.webmanifest — в корне сайта (src/root), остальное — img/favicon -->
  <link rel="icon" href="@@root/favicon.ico" sizes="32x32">
  <link rel="icon" href="@@root/img/favicon/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="@@root/img/favicon/apple-touch-icon.png">
  <link rel="manifest" href="@@root/site.webmanifest">

  <!-- Шрифты подключены в template_styles.css (scss/_fonts.scss); preload — основные кириллические начертания -->
  <link rel="preload" href="@@root/fonts/nunito-cyrillic-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="@@root/fonts/nunito-cyrillic-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="@@root/fonts/inter-cyrillic-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="@@root/css/vendor.css">
  <link rel="stylesheet" href="@@root/css/template_styles.css">
</head>
<!-- data-demo — демо-режим статичной вёрстки: корзина и избранное в браузере (js/cart-demo.js, js/favorites-demo.js); на сайте атрибут убрать -->
