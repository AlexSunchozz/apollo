<div class="row g-3">
  <div class="col-12">
    <div class="ap-field d-flex flex-column gap-2">
      <label class="ap-field__label ap-field__label--muted" for="@@prefix-city">Город или&nbsp;населённый пункт</label>
      <input class="ap-input ap-input--filled" type="text" id="@@prefix-city" name="@@name[city]" placeholder=" " autocomplete="address-level2" required data-address-field="city">
    </div>
  </div>
  <div class="col-12">
    <div class="ap-field d-flex flex-column gap-2">
      <label class="ap-field__label ap-field__label--muted" for="@@prefix-street">Улица</label>
      <input class="ap-input ap-input--filled" type="text" id="@@prefix-street" name="@@name[street]" placeholder=" " autocomplete="address-line1" required data-address-field="street">
    </div>
  </div>
  <div class="col-12 col-md-4">
    <div class="ap-field d-flex flex-column gap-2">
      <label class="ap-field__label ap-field__label--muted" for="@@prefix-house">Дом</label>
      <input class="ap-input ap-input--filled" type="text" id="@@prefix-house" name="@@name[house]" placeholder=" " required data-address-field="house">
    </div>
  </div>
  <div class="col-12 col-md-4">
    <div class="ap-field d-flex flex-column gap-2">
      <label class="ap-field__label ap-field__label--muted" for="@@prefix-building">Корпус&nbsp;/ строение</label>
      <input class="ap-input ap-input--filled" type="text" id="@@prefix-building" name="@@name[building]" placeholder=" " data-address-field="building">
    </div>
  </div>
  <div class="col-12 col-md-4">
    <div class="ap-field d-flex flex-column gap-2">
      <label class="ap-field__label ap-field__label--muted" for="@@prefix-flat">Квартира&nbsp;/ офис</label>
      <input class="ap-input ap-input--filled" type="text" id="@@prefix-flat" name="@@name[flat]" placeholder=" " data-address-field="flat">
    </div>
  </div>
  <div class="col-12 col-md-4">
    <div class="ap-field d-flex flex-column gap-2">
      <label class="ap-field__label ap-field__label--muted" for="@@prefix-entrance">Подъезд</label>
      <input class="ap-input ap-input--filled" type="text" id="@@prefix-entrance" name="@@name[entrance]" placeholder=" " inputmode="numeric" data-address-field="entrance">
    </div>
  </div>
  <div class="col-12 col-md-4">
    <div class="ap-field d-flex flex-column gap-2">
      <label class="ap-field__label ap-field__label--muted" for="@@prefix-floor">Этаж</label>
      <input class="ap-input ap-input--filled" type="text" id="@@prefix-floor" name="@@name[floor]" placeholder=" " inputmode="numeric" data-address-field="floor">
    </div>
  </div>
  <div class="col-12 col-md-4">
    <div class="ap-field d-flex flex-column gap-2">
      <label class="ap-field__label ap-field__label--muted" for="@@prefix-intercom">Домофон</label>
      <input class="ap-input ap-input--filled" type="text" id="@@prefix-intercom" name="@@name[intercom]" placeholder=" " data-address-field="intercom">
    </div>
  </div>
</div>
