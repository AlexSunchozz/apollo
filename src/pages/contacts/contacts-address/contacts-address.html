<!--
  «Контакты» — адрес и карта
  Figma:  десктоп 1:6126, мобилка 1:6206
  < 992:  карточка адреса, под ней карта; ≥ 992 — рядом, по половине.
  Карта — пока картинка-заглушка из макета (img/contacts/map-placeholder.svg).
  TODO: вставить актуальный скрипт Яндекс.Карт: подключить API (https://api-maps.yandex.ru/v3/?apikey=…&lang=ru_RU),
        в блоке [data-map] вместо <img> создать карту с меткой офиса (координаты — по адресу ниже).
        Размеры блока заданы в CSS (.ap-contacts-address__map) — карта займёт его целиком.
-->
<section class="ap-section ap-contacts-address" aria-labelledby="address-title">
  <div class="container px-3 px-sm-4">
    <div class="ap-contacts-address__inner d-flex flex-column flex-lg-row">
      <div class="ap-contacts-address__card d-flex flex-column justify-content-between p-3 p-xl-4">
        <h2 class="ap-contacts-address__title" id="address-title">Адрес</h2>
        <address class="ap-contacts-address__text">Санкт-Петербург,<br>Название улицы, дом&nbsp;00,<br>офис 000</address>
      </div>
      <div class="ap-contacts-address__map" data-map>
        <img src="@@root/img/contacts/map-placeholder.svg" width="640" height="264" alt="Карта: Санкт-Петербург, офис Apollo" loading="lazy">
      </div>
    </div>
  </div>
</section>
