<div class="ap-account-data__row@@if (context.stack) { ap-account-data__row--stack}" data-data-row>
  <p class="ap-account-data__label">@@label</p>
  <p class="ap-account-data__value" data-row-value>@@value</p>
  <button class="ap-account-data__edit" type="button" aria-label="Изменить: @@label" data-row-edit><svg class="ap-icon" aria-hidden="true"><use href="@@root/img/sprite.svg#edit"></use></svg><span class="d-none d-md-inline" aria-hidden="true">Изменить</span></button>

  <form class="ap-account-data__form" action="#" method="post" novalidate hidden data-form data-row-form>
    @@if (context.current) {<p class="ap-account-data__current">@@current</p>}
    <div class="ap-field d-flex flex-column gap-2">
      <label class="ap-field__label ap-field__label--muted" for="@@id">@@fieldLabel</label>
      <input class="ap-input ap-account-data__input" type="@@type" id="@@id" name="@@name" value="@@inputValue" autocomplete="@@autocomplete" inputmode="@@inputmode" required@@if (context.phone) { data-phone}>
      @@if (context.hint) {<p class="ap-account-data__hint" data-row-hint data-sent="@@sent">@@hint</p>}
    </div>
    @@if (context.confirm) {<div hidden data-row-confirm><div class="ap-field d-flex flex-column gap-2">
      <label class="ap-field__label ap-field__label--muted" for="@@id-code">Введите код из&nbsp;СМС</label>
      <input class="ap-input ap-account-data__input" type="text" id="@@id-code" name="code" autocomplete="one-time-code" inputmode="numeric" maxlength="6" required disabled>
    </div></div>}
    <div class="ap-account-data__buttons d-flex flex-wrap">
      <button class="ap-btn ap-btn--outline" type="button" data-row-cancel>Отмена</button>
      <button class="ap-btn ap-btn--primary" type="submit" data-row-submit@@if (context.confirm) { data-confirm-text="Подтвердить номер"}>Сохранить</button>
    </div>
  </form>
</div>
