<!--
  Страница «Технические работы»: иконка, заголовок, текст, «Обновить страницу →», «Спасибо за терпение!»
  Figma:  десктоп 1:6891, мобилка 1:6909
  На сайте её отдаёт сервер вместо любой страницы во время работ (код 503, адрес не меняется — настраивает интегратор),
  поэтому «Обновить страницу» перезагружает тот адрес, на котором открылась эта страница (href="" — текущий адрес,
  работает и без JS). Если сервер всё же перенаправляет на отдельный адрес — исходный передаётся в ?back=<путь>,
  кнопка ведёт туда (maintenance-page.js).
  Отступы: мобилка — сверху 48, снизу 0, между текстом и кнопкой 24; ≥ 768 — сверху 24, снизу 60, линия снизу, 48.
-->
<section class="ap-section ap-maintenance-page" aria-labelledby="maintenance-title">
  <div class="container px-3 px-sm-4">
    <div class="ap-maintenance-page__inner d-flex flex-column align-items-center gap-4 gap-md-5 text-center">
      <div class="d-flex flex-column align-items-center gap-4">
        <svg class="ap-icon ap-maintenance-page__icon" aria-hidden="true"><use href="@@root/img/sprite.svg#maintenance"></use></svg>
        <div class="ap-heading align-items-center gap-4">
          <h1 class="ap-heading__title ap-maintenance-page__title" id="maintenance-title">Сайт временно недоступен</h1>
          <p class="ap-heading__text ap-maintenance-page__text">Мы&nbsp;обновляем сайт, чтобы ваши покупки стали ещё удобнее. Скоро вернёмся!</p>
        </div>
      </div>
      <div class="d-flex flex-column align-items-center gap-2">
        <a class="ap-btn ap-btn--primary" href="" data-maintenance-reload>Обновить страницу&nbsp;→</a>
        <p class="ap-maintenance-page__note">Спасибо за&nbsp;терпение!</p>
      </div>
    </div>
  </div>
</section>
