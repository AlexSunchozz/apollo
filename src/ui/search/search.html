<form class="ap-search d-flex align-items-center gap-3" action="/search" method="get" role="search" data-search>
  <input class="ap-search__input" type="search" name="q" placeholder="Найти нож, тарелку, чайник или серию..." aria-label="Поиск по каталогу" autocomplete="off" aria-controls="@@panel" aria-expanded="false" data-search-input>
  <button class="ap-search__btn ap-search__clear align-items-center justify-content-center" type="button" aria-label="Очистить поиск" hidden data-search-clear>
    <svg class="ap-icon" aria-hidden="true"><use href="@@root/img/sprite.svg#close-sm"></use></svg>
  </button>
  <button class="ap-search__btn d-flex align-items-center justify-content-center" type="submit" aria-label="Найти">
    <svg class="ap-icon" aria-hidden="true"><use href="@@root/img/sprite.svg#search"></use></svg>
  </button>
</form>
