<label class="ap-choice">
  <input class="ap-radio" type="radio" name="@@name" value="@@value"@@if (context.checked) { checked}>
  <svg class="ap-icon ap-choice__icon" aria-hidden="true"><use href="@@root/img/sprite.svg#@@icon"></use></svg>
  <span class="ap-choice__text d-flex flex-column gap-1">
    <span class="ap-choice__title">@@title</span>
    <span class="ap-choice__note">@@text</span>
  </span>
</label>
