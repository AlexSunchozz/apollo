<div class="ap-view-switch d-flex" role="group" aria-label="Вид списка" data-view-switch data-view-target="@@target">
  <button class="ap-view-switch__btn" type="button" aria-pressed="true" aria-label="Плотная сетка" data-view="grid"><svg class="ap-icon" aria-hidden="true"><use href="@@root/img/sprite.svg#view-grid"></use></svg></button>
  @@if (context.large) {<button class="ap-view-switch__btn" type="button" aria-pressed="false" aria-label="Крупная сетка" data-view="large"><svg class="ap-icon" aria-hidden="true"><use href="@@root/img/sprite.svg#view-large"></use></svg></button>}
  <button class="ap-view-switch__btn" type="button" aria-pressed="false" aria-label="Список" data-view="list"><svg class="ap-icon" aria-hidden="true"><use href="@@root/img/sprite.svg#view-list"></use></svg></button>
</div>
