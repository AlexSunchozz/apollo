<article class="ap-feature-card@@if (context.mod) { ap-feature-card--@@mod} d-flex flex-column justify-content-between align-items-start">
  @@if (context.icon) {<svg class="ap-icon" aria-hidden="true"><use href="@@root/img/sprite.svg#@@icon"></use></svg>}
  <div class="d-flex flex-column gap-2">
    <h3 class="ap-feature-card__title">@@title</h3>
    <p class="ap-feature-card__text">@@text</p>
  </div>
</article>
