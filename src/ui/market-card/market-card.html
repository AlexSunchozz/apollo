<a class="ap-market-card d-flex flex-column align-items-end justify-content-between" href="@@href"@@if (context.stub) { data-stub}>
  <span class="ap-market-card__logo">
    <img class="ap-market-card__logo-img" src="@@root/img/markets/@@logo.svg" width="48" height="48" alt="" loading="lazy">
    <img class="ap-market-card__logo-img ap-market-card__logo-img--hover" src="@@root/img/markets/@@logo-light.svg" width="48" height="48" alt="" loading="lazy">
  </span>
  <span class="ap-market-card__title align-self-stretch">@@title</span>
</a>
